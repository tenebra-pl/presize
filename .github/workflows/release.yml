name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext libglib2.0-bin

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          for f in src/*.js; do node --check "$f"; done
          make pack VERSION="${{ steps.version.outputs.version }}"
          grep version-name build/metadata.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Presize ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "Upload \`presize@tenebra.shell-extension.zip\` to https://extensions.gnome.org/upload/ to publish this version." \
            presize@tenebra.shell-extension.zip
