name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext libglib2.0-bin

      - name: JavaScript syntax
        run: for f in src/*.js; do node --check "$f"; done

      # Every .po must compile. Missing strings are a warning, not a failure:
      # untranslated text falls back to English at runtime.
      - name: Translations compile and are complete
        run: |
          xgettext --from-code=UTF-8 --language=JavaScript --keyword=_ -o /tmp/presize.pot src/prefs.js src/extension.js
          for po in po/*.po; do
            msgfmt --check -o /dev/null "$po"
            if ! msgcmp --use-untranslated "$po" /tmp/presize.pot >/dev/null 2>&1; then
              echo "::warning file=$po::$po is missing translations; those strings will show in English"
              msgcmp --use-untranslated "$po" /tmp/presize.pot || true
            fi
          done

      - name: Build and pack
        run: make pack VERSION=ci

      - name: Zip contents
        run: unzip -l presize@tenebra.shell-extension.zip

      # The same static checks extensions.gnome.org recommends before uploading.
      - name: Shexli review-guideline check
        run: |
          pip install -q shexli
          shexli presize@tenebra.shell-extension.zip
